<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Add app Running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 12px">
      <button aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></button>
      <div style="flex:1;font-size:17px;font-weight:700">Add app</div>
      <button aria-label="Close" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button>
    </div>
    <div style="flex:none;margin:0 16px;height:32px;display:flex;gap:18px;border-bottom:1px solid #232a1d;font-size:13px">
      <button style="height:32px;box-sizing:border-box;font-weight:600;border-bottom:2px solid #c6f26b">Running</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Installed</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Tracked</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Browse…</button>
    </div>
    <div style="flex:1;min-height:0;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="font-size:12px;color:#9aa391">Open on your Mac right now</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="5">
          <div style="height:44px;flex:none;display:flex;align-items:center;gap:12px">
            <div style="width:38px;height:38px;box-sizing:border-box;border-radius:10px;background:#141910;border:1px solid #232a1d;color:{{a.c}};font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none">{{a.l}}</div>
            <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">{{a.name}}</div><div style="font-size:11px;color:#9aa391">{{a.open}}</div></div>
            <sc-if value="{{a.untracked}}" hint-placeholder-val="{{ true }}">
              <button aria-label="Not this one" title="Not this one" style="width:38px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #2b3125;display:flex;align-items:center;justify-content:center;color:#9aa391;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M1.5 9S4.5 4 9 4s7.500 5 7.500 5-3 5-7.500 5S1.500 9 1.500 9z"></path><circle cx="9" cy="9" r="2.200"></circle><path d="M3 15L15 3"></path></svg></button>
              <button aria-label="Track" title="Track" style="width:40px;height:32px;border-radius:10px;background:#c6f26b;display:flex;align-items:center;justify-content:center;color:#11140f;flex:none"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.500 8.500c2 3.600 4.400 5 7.500 5s5.500-1.400 7.500-5"></path><path d="M5 12l-1.500 2.200M8 13.600l-.600 2.600M12 13.600l.600 2.600M15 12l1.500 2.200"></path></svg></button>
            </sc-if>
            <sc-if value="{{a.tracked}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Stop tracking" title="Tracking · click to stop" style="width:38px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #c6f26b;display:flex;align-items:center;justify-content:center;color:#c6f26b;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M1.5 9S4.5 4 9 4s7.500 5 7.500 5-3 5-7.500 5S1.500 9 1.500 9z"></path><circle cx="9" cy="9" r="2.200"></circle></svg></button>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="border:1px dashed #2b3125;border-radius:10px;padding:12px 14px;font-size:12px;color:#cfd6c4">Don't see it? Open it first, or look in <span style="color:#c6f26b;font-weight:700;text-decoration:underline">Installed</span>.</div>
    </div>
    <div style="height:46px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
      <span style="font-size:11px;color:#9aa391">1 added this session</span>
      <button style="height:28px;padding:0 14px;border:1px solid #2b3125;border-radius:8px;font-size:12px;font-weight:600">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const track = { untracked: true, tracked: false };
    const done = { untracked: false, tracked: true };
    const apps = [
      { l: 'N', c: '#ff9fb4', name: 'Notion', open: 'open 2h 14m', ...track },
      { l: 'Z', c: '#8fd3ff', name: 'Zoom', open: 'open 48m', ...done },
      { l: 'T', c: '#ffe08a', name: 'Terminal', open: 'open 5h 02m', ...track },
      { l: 'P', c: '#d3a6ff', name: 'Preview', open: 'open 12m', ...track },
      { l: 'M', c: '#ffb86b', name: 'Mail', open: 'open 6h 30m', ...track }
    ];
    return { apps };
  }
}
</script>
</body>
</html>
