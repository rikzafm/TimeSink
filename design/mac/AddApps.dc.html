<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Add app Installed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px">
      <button aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></button>
      <div style="flex:1;font-size:17px;font-weight:700">Add app</div>
      <button aria-label="Close" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button>
    </div>
    <div style="flex:none;margin:0 16px;height:32px;display:flex;gap:18px;border-bottom:1px solid #232a1d;font-size:13px">
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Running</button>
      <button style="height:32px;box-sizing:border-box;font-weight:600;border-bottom:2px solid #c6f26b">Installed</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Tracked</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Browse…</button>
    </div>
    <div style="flex:1;min-height:0;padding:12px 12px 0 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden">
      <div style="flex:none;height:40px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid #3a4434;border-radius:12px;background:#141910;margin-right:4px">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#cfd6c4" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"></circle><path d="M10.7 10.7L14 14"></path></svg>
        <input aria-label="Search installed apps" placeholder="Search installed apps" style="flex:1;background:none;border:0;outline:0;color:#eef2e6;font-size:13px">
      </div>
      <div style="flex:1;min-height:0;display:flex;gap:6px;overflow:hidden">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="10">
            <div style="flex:none;height:{{it.h}}px;display:flex;align-items:center;gap:12px">
              <sc-if value="{{it.head}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;color:#c6f26b">{{it.name}}</span></sc-if>
              <sc-if value="{{it.row}}" hint-placeholder-val="{{ true }}">
                <div style="width:36px;height:36px;box-sizing:border-box;border-radius:9px;background:#141910;border:1px solid #232a1d;color:{{it.c}};font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none">{{it.l}}</div>
                <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.name}}</div><div style="font-size:10px;color:#9aa391">{{it.sub}}</div></div>
                <sc-if value="{{it.untracked}}" hint-placeholder-val="{{ true }}">
                  <button aria-label="Track {{it.name}}" title="Track" style="width:40px;height:32px;border-radius:10px;background:#c6f26b;display:flex;align-items:center;justify-content:center;color:#11140f;flex:none"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 8.5c2 3.6 4.4 5 7.5 5s5.500-1.400 7.500-5"></path><path d="M5 12l-1.500 2.200M8 13.600l-.600 2.600M12 13.600l.600 2.600M15 12l1.500 2.200"></path></svg></button>
                </sc-if>
                <sc-if value="{{it.tracked}}" hint-placeholder-val="{{ false }}">
                  <button aria-label="Game type" title="Game type" style="width:36px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid {{it.gb}};display:flex;align-items:center;justify-content:center;color:{{it.gc}};flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5.500" width="14" height="7.500" rx="3.500"></rect><path d="M6 7.500v3.500M4.250 9.250h3.500"></path><circle cx="11.500" cy="8.500" r=".6"></circle><circle cx="13" cy="10" r=".6"></circle></svg></button>
                  <button aria-label="Merge" title="Merge…" style="width:36px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #2b3125;display:flex;align-items:center;justify-content:center;color:#cfd6c4;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.500l6.500 3.300L9 9 2.500 5.800z"></path><path d="M2.500 9L9 12.200 15.500 9"></path><path d="M2.500 12.200L9 15.500l6.500-3.300"></path></svg></button>
                  <button aria-label="Stop tracking" title="Stop tracking" style="width:36px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #2b3125;display:flex;align-items:center;justify-content:center;color:#c6f26b;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M1.500 9S4.500 4 9 4s7.500 5 7.500 5-3 5-7.500 5S1.500 9 1.500 9z"></path><circle cx="9" cy="9" r="2.200"></circle></svg></button>
                </sc-if>
                <sc-if value="{{it.stopped}}" hint-placeholder-val="{{ false }}">
                  <button style="height:30px;padding:0 12px;border-radius:9px;border:1px solid #2b3125;font-size:12px;font-weight:700;color:#cfd6c4;flex:none">Restore</button>
                </sc-if>
              </sc-if>
            </div>
          </sc-for>
        </div>
        <div style="flex:none;width:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;color:#9aa391;font-weight:600"><span>A</span><span>B</span><span>C</span><span>D</span><span>F</span><span>I</span><span>N</span><span>P</span><span>S</span><span>X</span><span>Z</span></div>
      </div>
    </div>
    <div style="height:46px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
      <span style="font-size:11px;color:#9aa391">0 added this session</span>
      <button style="height:28px;padding:0 14px;border:1px solid #2b3125;border-radius:8px;font-size:12px;font-weight:600">Done</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { head: false, row: true, h: 54, untracked: false, tracked: false, stopped: false, gb: '#2b3125', gc: '#cfd6c4' };
    const head = (name) => ({ head: true, row: false, h: 24, name, untracked: false, tracked: false, stopped: false });
    const un = (l, c, name, sub) => ({ ...base, l, c, name, sub, untracked: true });
    const tr = (l, c, name, sub, game) => ({ ...base, l, c, name, sub, tracked: true, gb: game ? '#c6f26b' : '#2b3125', gc: game ? '#c6f26b' : '#cfd6c4' });
    const st = (l, c, name, sub) => ({ ...base, l, c, name, sub, stopped: true });
    const items = [
      head('A'), un('A', '#8fd3ff', 'Activity Monitor', 'Apple'), un('A', '#ff9fb4', 'Affinity Photo', 'Serif'), tr('A', '#d3a6ff', 'Antigravity IDE', 'Google LLC', false), un('A', '#ffe08a', 'App Store', 'Apple'),
      head('C'), tr('C', '#c6f26b', 'Chrome', 'Google LLC · Mac and PC', false), un('C', '#ffb86b', 'Calendar', 'Apple'),
      head('H'), tr('H', '#ffb86b', 'Hades', 'Supergiant Games', true),
      head('S'), st('S', '#8fd3ff', 'Steam', 'Stopped · history kept')
    ];
    return { items };
  }
}
</script>
</body>
</html>
