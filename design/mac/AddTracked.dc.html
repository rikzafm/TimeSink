<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Add app Tracked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px">
      <button aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></button>
      <div style="flex:1;font-size:17px;font-weight:700">Add app</div>
      <button aria-label="Close" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"></path></svg></button>
    </div>
    <div style="flex:none;margin:0 16px;height:32px;display:flex;gap:18px;border-bottom:1px solid #232a1d;font-size:13px">
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Running</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Installed</button>
      <button style="height:32px;box-sizing:border-box;font-weight:600;border-bottom:2px solid #c6f26b">Tracked</button>
      <button style="height:32px;box-sizing:border-box;color:#9aa391">Browse…</button>
    </div>
    <div style="flex:1;min-height:0;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden">
      <div style="flex:none;height:40px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid #3a4434;border-radius:12px;background:#141910">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#cfd6c4" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"></circle><path d="M10.7 10.7L14 14"></path></svg>
        <input aria-label="Search tracked apps" placeholder="Search tracked apps" style="flex:1;background:none;border:0;outline:0;color:#eef2e6;font-size:13px">
      </div>
      <div style="font-size:10px;letter-spacing:1px;color:#9aa391">TRACKED NOW</div>
      <div style="display:flex;flex-direction:column;overflow:hidden">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
          <div style="height:56px;flex:none;display:flex;align-items:center;gap:12px;border-radius:10px;background:{{a.bg}};padding:0 4px">
            <div style="position:relative;width:38px;height:38px;flex:none">
              <div style="width:38px;height:38px;box-sizing:border-box;border-radius:10px;background:#141910;border:1px solid #232a1d;color:{{a.c}};font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center">{{a.l}}</div>
              <div style="position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:8px;background:{{a.badgeBg}};color:#11140f;font-size:9px;font-weight:800;display:{{a.badgeShow}};align-items:center;justify-content:center;border:2px solid #11140f;box-sizing:border-box">{{a.badge}}</div>
            </div>
            <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{a.name}}</div><div style="font-size:11px;color:#9aa391">{{a.pub}}</div></div>
            <button aria-label="Game type" title="Game type" style="width:38px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid {{a.gb}};display:flex;align-items:center;justify-content:center;color:{{a.gc}};flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5.500" width="14" height="7.500" rx="3.500"></rect><path d="M6 7.500v3.500M4.250 9.250h3.500"></path><circle cx="11.500" cy="8.500" r=".6"></circle><circle cx="13" cy="10" r=".6"></circle></svg></button>
            <button aria-label="Merge" title="Merge…" style="width:38px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #2b3125;display:flex;align-items:center;justify-content:center;color:#cfd6c4;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.500l6.500 3.300L9 9 2.500 5.800z"></path><path d="M2.500 9L9 12.200 15.500 9"></path><path d="M2.500 12.200L9 15.500l6.500-3.300"></path></svg></button>
            <button aria-label="Stop tracking" title="Stop tracking" style="width:38px;height:32px;box-sizing:border-box;border-radius:10px;border:1px solid #2b3125;display:flex;align-items:center;justify-content:center;color:#cfd6c4;flex:none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M1.500 9S4.500 4 9 4s7.500 5 7.500 5-3 5-7.500 5S1.500 9 1.500 9z"></path><circle cx="9" cy="9" r="2.200"></circle></svg></button>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="height:46px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
      <span style="font-size:11px;color:#9aa391">Double-click an app for its settings</span>
      <button style="height:28px;padding:0 14px;border:1px solid #2b3125;border-radius:8px;font-size:12px;font-weight:600">Done</button>
    </div>
    <div style="position:absolute;left:76px;top:236px;height:24px;padding:0 10px;border-radius:7px;background:#eef2e6;color:#11140f;font-size:11px;font-weight:700;line-height:24px">Double-click → app settings</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (l, c, name, pub, game, badge, hot) => ({
      l, c, name, pub,
      gb: game ? '#c6f26b' : '#2b3125', gc: game ? '#c6f26b' : '#cfd6c4',
      badge: badge || '', badgeShow: badge ? 'flex' : 'none', badgeBg: '#6fc26f',
      bg: hot ? '#161b11' : 'transparent'
    });
    const apps = [
      row('X', '#8fd3ff', 'Xcode', 'Apple', false, 0, false),
      row('C', '#ffe08a', 'Chrome', 'Google LLC', false, 3, true),
      row('H', '#ffb86b', 'Hades', 'Supergiant Games', true, 0, false),
      row('B', '#ff9fb4', 'Balatro', 'Steam', true, 0, false),
      row('F', '#d3a6ff', 'Figma', 'Figma, Inc.', false, 0, false),
      row('S', '#c6f26b', 'Spotify', 'Spotify AB', false, 2, false),
      row('L', '#8fd3ff', 'LM Studio', 'LM Studio', false, 0, false)
    ];
    return { apps };
  }
}
</script>
</body>
</html>
