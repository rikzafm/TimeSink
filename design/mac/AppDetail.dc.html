<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink App detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px">
      <button style="display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:6px;font-size:13px;color:#c6f26b"><span style="font-size:16px">‹</span>All</button>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600">App detail</div>
      <button style="height:28px;padding:0 8px;border-radius:6px;font-size:12px;color:#cfd6c4">Settings</button>
    </div>
    <div style="flex:1;min-height:0;padding:4px 14px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:11px;background:#c6f26b;color:#11140f;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none">C</div>
        <div style="flex:1">
          <div style="font-size:18px;font-weight:700">Chrome</div>
          <div style="font-size:11px;color:#9aa391;margin-top:2px">Merged ×2 · tracked since 14 Mar 2026</div>
        </div>
        <div style="text-align:right"><div style="font-size:22px;font-weight:600;letter-spacing:-0.4px">283 h</div><div style="font-size:10px;color:#9aa391">lifetime · 35% share</div></div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:8px 10px"><div style="font-size:10px;color:#9aa391">Last opened</div><div style="font-size:13px;font-weight:600;margin-top:3px;color:#c6f26b">Running now</div></div>
        <div style="flex:1;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:8px 10px"><div style="font-size:10px;color:#9aa391">Average session</div><div style="font-size:13px;font-weight:600;margin-top:3px">1h 24m</div></div>
        <div style="flex:1;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:8px 10px"><div style="font-size:10px;color:#9aa391">Times opened</div><div style="font-size:13px;font-weight:600;margin-top:3px">202</div></div>
      </div>
      <div style="border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 12px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#cfd6c4;margin-bottom:6px"><span style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:3px;background:#c6f26b"></span>Mac 124 h</span><span style="display:flex;align-items:center;gap:6px">PC 159 h<span style="width:7px;height:7px;border-radius:1px;background:#5fa8ff"></span></span></div>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px"><div style="flex:124;background:#c6f26b"></div><div style="flex:159;background:#5fa8ff"></div></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px">
          <button aria-label="Previous year" style="width:24px;height:24px;border-radius:6px;background:#181d13;border:1px solid #232a1d;font-size:13px">‹</button>
          <span style="font-size:13px;font-weight:600;width:40px;text-align:center">2026</span>
          <button aria-label="Next year" style="width:24px;height:24px;border-radius:6px;background:#181d13;border:1px solid #232a1d;font-size:13px;color:#9aa391">›</button>
        </div>
        <div style="display:flex;gap:2px;padding:2px;background:#181d13;border:1px solid #232a1d;border-radius:7px;font-size:11px"><button style="padding:2px 8px;color:#9aa391">All</button><button style="padding:2px 8px;border-radius:5px;background:#2b3125;font-weight:600">Year</button><button style="padding:2px 8px;color:#9aa391">Month</button><button style="padding:2px 8px;color:#9aa391">Week</button></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
          <div>
            <div style="font-size:10px;color:#9aa391;margin-bottom:3px">{{m.n}}</div>
            <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
              <sc-for list="{{m.cells}}" as="c" hint-placeholder-count="30"><div style="height:8px;border-radius:2px;background:{{c.bg}};border:{{c.bd}};box-sizing:border-box"></div></sc-for>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:#9aa391">Quarters of this app's busiest day (8h 40m)
        <span style="display:flex;gap:2px;margin-left:auto"><span style="width:10px;height:8px;border-radius:2px;background:#1b2116"></span><span style="width:10px;height:8px;border-radius:2px;background:#2d3d1c"></span><span style="width:10px;height:8px;border-radius:2px;background:#46691f"></span><span style="width:10px;height:8px;border-radius:2px;background:#75a826"></span><span style="width:10px;height:8px;border-radius:2px;background:#c6f26b"></span></span>
      </div>
    </div>
    <div style="height:44px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px">
      <span style="color:#9aa391">App time, not uptime</span>
      <button style="color:#cfd6c4">Export app (CSV)</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const ramp = ['#1b2116','#2d3d1c','#46691f','#75a826','#c6f26b'];
    const months = names.map((n, m) => {
      const lead = (new Date(2026, m, 1).getDay() + 6) % 7;
      const days = new Date(2026, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push({ bg: 'transparent', bd: '0' });
      for (let d = 1; d <= days; d++) {
        const before = m < 2 || (m === 2 && d < 14);
        const after = m > 10 || (m === 10 && d > 1);
        if (before || after) { cells.push({ bg: 'transparent', bd: '1px solid #232a1d' }); continue; }
        const r = (m * 31 + d * 17) % 11;
        const lvl = r < 2 ? 0 : r < 4 ? 1 : r < 7 ? 2 : r < 9 ? 3 : 4;
        cells.push({ bg: ramp[lvl], bd: '0' });
      }
      return { n, cells };
    });
    return { months };
  }
}
</script>
</body>
</html>
