<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px">
      <div style="flex:1;display:flex;align-items:center;gap:9px"><span style="width:9px;height:9px;border-radius:5px;background:#c6f26b"></span><span style="font-size:17px;font-weight:700">TimeSink</span></div>
      <div style="display:flex;gap:2px;padding:2px;border:1px solid #2b3125;border-radius:8px;font-size:11px;margin-right:6px"><button style="padding:3px 8px;color:#9aa391">This Mac</button><button style="padding:3px 8px;border-radius:6px;background:#2b3125;font-weight:600">All devices</button></div>
            <button aria-label="Games only" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5.5" width="14" height="7.5" rx="3.5"></rect><path d="M6 7.5v3.5M4.25 9.25h3.5"></path><circle cx="11.5" cy="8.5" r=".6"></circle><circle cx="13" cy="10" r=".6"></circle></svg></button>
      <button aria-label="Settings" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg></button>
    </div>
    <div style="flex:none;display:flex;border-bottom:1px solid #232a1d;font-size:15px">
      <button style="flex:1;height:40px;color:#9aa391">Today</button>
      <button style="flex:1;height:40px;color:#9aa391">Week</button>
      <button style="flex:1;height:40px;box-sizing:border-box;font-weight:600;color:#c6f26b;border-bottom:2px solid #c6f26b">Month</button>
      <button style="flex:1;height:40px;color:#9aa391">Year</button>
      <button style="flex:1;height:40px;color:#9aa391">All</button>
    </div>
    <div style="flex:1;min-height:0;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:center;gap:30px;height:30px">
        <button aria-label="Previous month" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="7" height="10" viewBox="0 0 7 10" aria-hidden="true"><path d="M6 1L1 5l5 4z" fill="currentColor"></path></svg></button>
        <div style="font-size:17px;font-weight:700">October 2026</div>
        <button aria-label="Next month" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="7" height="10" viewBox="0 0 7 10" aria-hidden="true"><path d="M1 1l5 4-5 4z" fill="currentColor"></path></svg></button>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1.4"><div style="font-size:11px;color:#9aa391">Month total · all devices</div><div style="font-size:26px;font-weight:600;letter-spacing:-0.4px">142h 10m</div></div>
        <div style="flex:1"><div style="font-size:11px;color:#9aa391">Daily average</div><div style="font-size:15px;font-weight:600;margin-top:6px">4h 35m</div></div>
        <div style="flex:1"><div style="font-size:11px;color:#9aa391">Best day</div><div style="font-size:15px;font-weight:600;margin-top:6px">Oct 14 · 9h</div></div>
      </div>
      <div style="font-size:11px;color:#c6f26b">+8% vs September over the same 31 days</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#cfd6c4"><span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:4px;background:#c6f26b"></span>Mac 98h 20m</span><span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:2px;background:#5fa8ff"></span>PC 112h 40m</span><span style="color:#9aa391">68h 50m on both</span></div>
      <div style="flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 40px;gap:4px">
        <span style="font-size:10px;color:#9aa391;text-align:center">Mon</span><span style="font-size:10px;color:#9aa391;text-align:center">Tue</span><span style="font-size:10px;color:#9aa391;text-align:center">Wed</span><span style="font-size:10px;color:#9aa391;text-align:center">Thu</span><span style="font-size:10px;color:#9aa391;text-align:center">Fri</span><span style="font-size:10px;color:#9aa391;text-align:center">Sat</span><span style="font-size:10px;color:#9aa391;text-align:center">Sun</span><span style="font-size:10px;color:#9aa391;text-align:center">Week</span>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="40">
          <div style="height:40px;box-sizing:border-box;border-radius:6px;background:{{c.bg}};border:{{c.bd}};padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;color:{{c.fg}}">
            <span style="font-size:10px;opacity:0.85">{{c.d}}</span><span style="font-size:11px;font-weight:600">{{c.h}}</span>
          </div>
        </sc-for>
      </div>
      <div style="flex:none;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 12px">
        <div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600">Wed, Oct 21</span><span style="font-weight:600">7h 20m</span></div>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 6px;gap:2px"><div style="flex:48;background:#8fd3ff"></div><div style="flex:30;background:#c6f26b"></div><div style="flex:14;background:#d3a6ff"></div><div style="flex:8;background:#ffb86b"></div></div>
        <div style="font-size:11px;color:#9aa391">Mostly Xcode · 3h 31m</div>
      </div>
    </div>
    <div style="height:44px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px">
      <button style="font-size:12px;font-weight:600;color:#c6f26b">+ Add app</button>
      <button style="color:#cfd6c4">Export month (CSV)</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const ramp = [['#1b2116','#9aa391'], ['#2d3d1c','#eef2e6'], ['#46691f','#eef2e6'], ['#75a826','#11140f'], ['#c6f26b','#11140f']];
    const level = (h) => h < 1 ? 0 : h < 3 ? 1 : h < 5 ? 2 : h < 7 ? 3 : 4;
    const cells = [];
    let day = 1;
    const lead = 3;
    for (let row = 0; row < 5; row++) {
      let weekSum = 0;
      for (let col = 0; col < 7; col++) {
        const idx = row * 7 + col;
        if (idx < lead || day > 31) { cells.push({ d: '', h: '', bg: 'transparent', bd: '1px dashed #232a1d', fg: '#9aa391' }); continue; }
        const weekend = col >= 5;
        const h = Math.max(0, Math.round((((day * 53) % 37) / 37 * 6 + (weekend ? 1 : 3.2)) * 10) / 10);
        weekSum += h;
        const [bg, fg] = ramp[level(h)];
        cells.push({ d: String(day), h: Math.round(h) + 'h', bg, bd: day === 21 ? '1px solid #c6f26b' : '1px solid transparent', fg });
        day++;
      }
      cells.push({ d: '', h: Math.round(weekSum) + 'h', bg: 'transparent', bd: '1px solid transparent', fg: '#cfd6c4' });
    }
    return { cells };
  }
}
</script>
</body>
</html>
