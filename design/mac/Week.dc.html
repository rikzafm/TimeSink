<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px">
      <div style="flex:1;display:flex;align-items:center;gap:9px"><span style="width:9px;height:9px;border-radius:5px;background:#c6f26b"></span><span style="font-size:17px;font-weight:700">TimeSink</span></div>
      <div style="display:flex;gap:2px;padding:2px;border:1px solid #2b3125;border-radius:8px;font-size:11px;margin-right:6px"><button style="padding:3px 8px;color:#9aa391">This Mac</button><button style="padding:3px 8px;border-radius:6px;background:#2b3125;font-weight:600">All devices</button></div>
            <button aria-label="Games only" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5.5" width="14" height="7.5" rx="3.5"></rect><path d="M6 7.5v3.5M4.25 9.25h3.5"></path><circle cx="11.5" cy="8.5" r=".6"></circle><circle cx="13" cy="10" r=".6"></circle></svg></button>
      <button aria-label="Settings" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg></button>
    </div>
    <div style="flex:none;display:flex;border-bottom:1px solid #232a1d;font-size:15px">
      <button style="flex:1;height:40px;color:#9aa391">Today</button>
      <button style="flex:1;height:40px;box-sizing:border-box;font-weight:600;color:#c6f26b;border-bottom:2px solid #c6f26b">Week</button>
      <button style="flex:1;height:40px;color:#9aa391">Month</button>
      <button style="flex:1;height:40px;color:#9aa391">Year</button>
      <button style="flex:1;height:40px;color:#9aa391">All</button>
    </div>
    <div style="flex:1;min-height:0;padding:14px 14px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="display:flex;align-items:flex-end;justify-content:space-between">
        <div>
          <div style="display:flex;align-items:center;gap:10px;font-size:11px;color:#9aa391"><button aria-label="Previous week" style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#cfd6c4"><svg width="6" height="9" viewBox="0 0 7 10" aria-hidden="true"><path d="M6 1L1 5l5 4z" fill="currentColor"></path></svg></button><span>This week</span><button aria-label="Next week (latest)" style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#4a5547"><svg width="6" height="9" viewBox="0 0 7 10" aria-hidden="true"><path d="M1 1l5 4-5 4z" fill="currentColor"></path></svg></button></div>
          <div style="font-size:32px;font-weight:600;letter-spacing:-0.5px;line-height:38px">38h 20m</div>
        </div>
        <div style="font-size:11px;color:#c6f26b;padding-bottom:6px">+3h 10m vs last week</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#cfd6c4"><span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:4px;background:#c6f26b"></span>Mac 28h 42m</span><span style="display:flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:2px;background:#5fa8ff"></span>PC 20h 36m</span><span style="color:#9aa391">10h 58m on both</span></div>
      <div style="height:134px;flex:none;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 12px 8px;box-sizing:border-box;display:flex;flex-direction:column">
        <div style="height:80px;display:flex;align-items:flex-end;gap:10px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:80px;gap:3px">
              <div style="font-size:10px;color:#9aa391">{{d.v}}</div>
              <div style="position:relative;width:100%;height:{{d.top}}px">
                <div style="position:absolute;bottom:0;left:0;width:{{d.mw}}%;height:{{d.mh}}px;border-radius:3px 3px 0 0;background:{{d.mbg}};z-index:{{d.mz}}"></div>
                <div style="position:absolute;bottom:0;right:0;width:{{d.pw}}%;height:{{d.ph}}px;border-radius:3px 3px 0 0;background:{{d.pbg}};z-index:{{d.pz}}"></div>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;gap:10px;margin-top:5px;font-size:10px;color:#9aa391;text-align:center">
          <span style="flex:1">Mon</span><span style="flex:1">Tue</span><span style="flex:1">Wed</span><span style="flex:1">Thu</span><span style="flex:1">Fri</span><span style="flex:1">Sat</span><span style="flex:1;color:#c6f26b;font-weight:600">Sun</span>
        </div>
        <div style="display:flex;gap:12px;margin-top:6px;font-size:9px;color:#9aa391"><span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:2px;background:#75a826"></span>Mac</span><span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:2px;background:#3f7fcc"></span>PC</span><span>Overlapping bars = both on · label is uptime, overlap once</span></div>
      </div>
      <div style="flex:none;border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 12px;box-sizing:border-box">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#9aa391;margin-bottom:8px"><span>Last 20 weeks</span><span style="color:#c6f26b;font-weight:600">23-day streak</span></div>
        <div style="display:grid;grid-template-columns:repeat(20,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:3px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="140">
            <div style="border-radius:2px;background:{{c.bg}}"></div>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;overflow:hidden">
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
          <div style="height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px">
            <div style="width:30px;height:30px;box-sizing:border-box;border-radius:8px;background:#141910;border:1px solid #232a1d;color:{{a.c}};font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">{{a.l}}</div>
            <div style="flex:1;font-size:13px;font-weight:600">{{a.name}}</div>
            <div style="display:flex;align-items:flex-end;gap:2px;height:20px">
              <sc-for list="{{a.spark}}" as="s" hint-placeholder-count="10"><div style="width:4px;height:{{s}}px;border-radius:1px;background:{{a.c}};opacity:0.8"></div></sc-for>
            </div>
            <div style="width:62px;text-align:right;font-size:13px;font-weight:600">{{a.time}}</div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="height:44px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px">
      <button style="font-size:12px;font-weight:600;color:#c6f26b">+ Add app</button>
      <span style="color:#9aa391">Last backup · 1 day ago</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const vals = [6.4, 5.8, 7.2, 5.1, 4.9, 2.7, 6.2];
    const mac = [4.8, 4.2, 5.5, 3.9, 3.1, 2.3, 4.9];
    const pc = [3.9, 3.4, 4.0, 2.8, 3.5, 0.9, 2.1];
    const k = 8.5;
    const days = vals.map((v, i) => {
      const today = i === 6;
      const both = mac[i] > 0 && pc[i] > 0;
      return {
        v: Math.round(v) + 'h',
        top: Math.round(Math.max(mac[i], pc[i]) * k),
        mh: Math.round(mac[i] * k), ph: Math.round(pc[i] * k),
        mw: both ? 66 : 100, pw: both ? 66 : 100,
        mz: mac[i] <= pc[i] ? 2 : 1, pz: pc[i] < mac[i] ? 2 : 1,
        mbg: today ? '#c6f26b' : '#75a826', pbg: today ? '#5fa8ff' : '#3f7fcc'
      };
    });
    const ramp = ['#1b2116', '#2d3d1c', '#46691f', '#75a826', '#c6f26b'];
    const cells = [];
    for (let i = 0; i < 140; i++) {
      const r = (i * 37 + 11) % 17;
      const lvl = i > 118 ? (r % 3) + 2 : i < 12 ? 0 : r < 3 ? 0 : r < 6 ? 1 : r < 10 ? 2 : r < 14 ? 3 : 4;
      cells.push({ bg: ramp[Math.min(lvl, 4)] });
    }
    const apps = [
      { l: 'X', c: '#8fd3ff', name: 'Xcode', time: '16h 40m', spark: [8, 12, 16, 14, 18, 10, 6, 15, 17, 20] },
      { l: 'S', c: '#c6f26b', name: 'Safari', time: '11h 05m', spark: [14, 10, 12, 16, 12, 14, 8, 11, 13, 12] },
      { l: 'F', c: '#d3a6ff', name: 'Figma', time: '6h 30m', spark: [4, 8, 6, 12, 14, 6, 2, 10, 8, 16] },
      { l: 'S', c: '#ffb86b', name: 'Spotify', time: '4h 05m', spark: [6, 6, 8, 5, 7, 9, 10, 6, 5, 7] }
    ];
    return { days, cells, apps };
  }
}
</script>
</body>
</html>
