<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TimeSink Year Matrix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:440px;height:700px;box-sizing:border-box;background:#0a0c08;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#eef2e6;font-variant-numeric:tabular-nums;position:relative;overflow:hidden">
  <div style="height:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;background:#161912;border-bottom:1px solid #232a1d">
    <div style="display:flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:5px;background:#2b3125;font-size:12px;font-weight:500">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c6f26b" stroke-width="1.6"></circle><path d="M6 3.5V6l1.8 1" fill="none" stroke="#c6f26b" stroke-width="1.4" stroke-linecap="round"></path></svg>
      <span>6h 12m</span>
    </div>
  </div>
  <div style="position:absolute;top:30px;right:92px;width:14px;height:14px;background:#11140f;border-left:1px solid #2b3125;border-top:1px solid #2b3125;transform:rotate(45deg)"></div>
  <div style="position:absolute;top:37px;left:20px;width:400px;height:640px;box-sizing:border-box;background:#11140f;border:1px solid #2b3125;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:44px;flex:none;display:flex;align-items:center;padding:0 14px">
      <div style="flex:1;display:flex;align-items:center;gap:9px"><span style="width:9px;height:9px;border-radius:5px;background:#c6f26b"></span><span style="font-size:17px;font-weight:700">TimeSink</span></div>
      <div style="display:flex;gap:2px;padding:2px;border:1px solid #2b3125;border-radius:8px;font-size:11px;margin-right:6px"><button style="padding:3px 8px;color:#9aa391">This Mac</button><button style="padding:3px 8px;border-radius:6px;background:#2b3125;font-weight:600">All devices</button></div>
            <button aria-label="Games only" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5.5" width="14" height="7.5" rx="3.5"></rect><path d="M6 7.5v3.5M4.25 9.25h3.5"></path><circle cx="11.5" cy="8.5" r=".6"></circle><circle cx="13" cy="10" r=".6"></circle></svg></button>
      <button aria-label="Settings" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#9aa391"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg></button>
    </div>
    <div style="flex:none;display:flex;border-bottom:1px solid #232a1d;font-size:15px">
      <button style="flex:1;height:40px;color:#9aa391">Today</button>
      <button style="flex:1;height:40px;color:#9aa391">Week</button>
      <button style="flex:1;height:40px;color:#9aa391">Month</button>
      <button style="flex:1;height:40px;box-sizing:border-box;font-weight:600;color:#c6f26b;border-bottom:2px solid #c6f26b">Year</button>
      <button style="flex:1;height:40px;color:#9aa391">All</button>
    </div>
    <div style="flex:1;min-height:0;padding:12px 14px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">
      <div style="align-self:center;display:flex;gap:2px;padding:2px;background:#181d13;border:1px solid #232a1d;border-radius:7px;font-size:11px">
        <button style="padding:3px 14px;color:#9aa391">Pace</button>
        <button style="padding:3px 14px;color:#9aa391">Wrapped</button>
        <button style="padding:3px 14px;border-radius:5px;background:#2b3125;font-weight:600">Matrix</button>
      </div>
      <div style="font-size:11px;color:#9aa391">2026 · hours per app per month · since Mar · all devices</div>
      <div style="border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 8px 8px">
        <div style="display:grid;grid-template-columns:78px repeat(9,minmax(0,1fr)) 40px;gap:3px;align-items:center">
          <span></span>
          <sc-for list="{{heads}}" as="h" hint-placeholder-count="9"><span style="font-size:10px;color:#9aa391;text-align:center">{{h}}</span></sc-for>
          <span style="font-size:10px;color:#9aa391;text-align:right">Total</span>
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="60">
            <div style="{{c.box}}"><span style="{{c.txt}}">{{c.t}}</span></div>
          </sc-for>
        </div>
      </div>
      <div style="font-size:10px;color:#9aa391;display:flex;align-items:center;gap:8px">Colour is relative to each app's own best month.
        <span style="display:flex;gap:2px;margin-left:auto"><span style="width:12px;height:8px;border-radius:2px;background:#1b2116"></span><span style="width:12px;height:8px;border-radius:2px;background:#2d3d1c"></span><span style="width:12px;height:8px;border-radius:2px;background:#46691f"></span><span style="width:12px;height:8px;border-radius:2px;background:#75a826"></span><span style="width:12px;height:8px;border-radius:2px;background:#c6f26b"></span></span>
      </div>
      <div style="border:1px solid #232a1d;border-radius:10px;background:#141910;padding:10px 12px">
        <div style="display:flex;justify-content:space-between;font-size:12px"><span style="font-weight:600">Xcode</span><span style="font-weight:600">400 h · 35%</span></div>
        <div style="font-size:11px;color:#9aa391;margin-top:4px">Peak Jul (62 h). Last 3 months up 12% on the 3 before.</div>
      </div>
    </div>
    <div style="height:44px;flex:none;border-top:1px solid #232a1d;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px">
      <button style="font-size:12px;font-weight:600;color:#c6f26b">+ Add app</button>
      <span style="color:#9aa391">Tap an app or a month</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const heads = ['M','A','M','J','J','A','S','O','N'];
    const apps = [
      { n: 'Xcode', c: '#8fd3ff', v: [18,44,50,52,62,58,54,60,2], sel: true },
      { n: 'Chrome', c: '#c6f26b', v: [14,32,36,40,44,38,35,42,2] },
      { n: 'VS Code', c: '#d3a6ff', v: [8,20,22,26,24,28,26,30,1] },
      { n: 'Figma', c: '#ffb86b', v: [4,9,14,10,12,13,16,17,1] },
      { n: 'Spotify', c: '#ff9fb4', v: [6,8,9,10,9,11,10,11,1] },
      { n: 'Slack', c: '#ffe08a', v: [2,5,6,5,7,6,5,5,0] },
      { n: 'Discord', c: '#5fa8ff', v: [1,3,4,6,8,7,9,10,0] }
    ];
    const ramp = ['#1b2116','#2d3d1c','#46691f','#75a826','#c6f26b'];
    const cells = [];
    const cellBase = 'height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;';
    apps.forEach((a) => {
      const max = Math.max(...a.v);
      const total = a.v.reduce((s, x) => s + x, 0);
      cells.push({ box: 'display:flex;align-items:center;gap:5px;min-width:0;', txt: 'font-size:11px;font-weight:' + (a.sel ? 700 : 500) + ';color:' + (a.sel ? '#c6f26b' : '#eef2e6') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;', t: a.n });
      a.v.forEach((x) => {
        const lvl = x === 0 ? 0 : Math.min(4, Math.ceil((x / max) * 4));
        const dark = lvl >= 3;
        cells.push({ box: cellBase + 'background:' + ramp[lvl] + ';', txt: 'font-size:10px;font-weight:600;color:' + (dark ? '#11140f' : '#cfd6c4') + ';', t: x === 0 ? '' : String(x) });
      });
      cells.push({ box: 'display:flex;justify-content:flex-end;', txt: 'font-size:11px;font-weight:600;color:#eef2e6;', t: String(total) });
    });
    const totals = [53,121,141,149,166,161,155,175,7];
    cells.push({ box: 'border-top:1px solid #232a1d;padding-top:6px;', txt: 'font-size:11px;font-weight:600;', t: 'Total' });
    totals.forEach((x) => cells.push({ box: 'border-top:1px solid #232a1d;padding-top:6px;display:flex;justify-content:center;', txt: 'font-size:10px;font-weight:600;color:#cfd6c4;', t: String(x) }));
    cells.push({ box: 'border-top:1px solid #232a1d;padding-top:6px;display:flex;justify-content:flex-end;', txt: 'font-size:11px;font-weight:700;color:#c6f26b;', t: '1,128' });
    return { heads, cells };
  }
}
</script>
</body>
</html>
